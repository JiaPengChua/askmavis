<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AskMavis — Ada Window</title>
<meta name="description" content="AskMavis AI Mode mockup: Ada's own chat window mounted in the page with parentElement.">
<link rel="icon" href="../assets/mh-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css?v=20261023b">
<style>
  body{min-height:100vh;display:flex;flex-direction:column}
  .aw-grid{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:8px 20px 0;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:36px;align-items:start}
  .aw-left .am-hero{padding:34px 0 0;max-width:none}
  .aw-left .am-cards{margin-top:28px}
  .aw-left .am-disclaimer{text-align:left;margin-top:22px}
  .aw-left .newchat{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--primary-blue-light);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .aw-window{position:sticky;top:calc(var(--mh-header-h) + 16px);height:calc(100vh - var(--mh-header-h) - 120px);min-height:520px;margin-top:22px;
    background:#fff;border:1px solid var(--grey-light);border-radius:22px;box-shadow:var(--shadow-card);overflow:hidden}
  .aw-window iframe{border:0}
  .aw-window .boot{height:100%;display:grid;place-items:center;color:var(--grey-ultradark);font-size:14px}
  @media(max-width:900px){
    .aw-grid{grid-template-columns:minmax(0,1fr);gap:0;padding:0 16px}
    .aw-left{min-width:0}
    .aw-left .am-hero{padding-top:22px}
    .aw-left .am-cards{flex-direction:row;overflow-x:auto;gap:10px;margin:18px -16px 0;padding:2px 16px 8px;scroll-snap-type:x mandatory}
    .aw-left .am-card{min-width:78%;scroll-snap-align:start}
    .aw-left .am-disclaimer{display:none}
    .aw-window{position:relative;top:0;height:72vh;min-height:460px;margin-top:12px}
  }
</style>
</head>
<body>
<header class="mh-header" id="mh-header"></header>
<div id="am-bar"></div>
<div class="am-note" id="am-note" hidden></div>
<main class="aw-grid">
  <section class="aw-left">
    <div id="am-hero"></div>
    <p class="am-disclaimer" id="am-disclaimer"></p>
    <button class="newchat" id="newchat" type="button">Start a new chat</button>
  </section>
  <section class="aw-window" id="ada-window" aria-label="Chat with Mavis"><div class="boot">Connecting to Mavis…</div></section>
</main>
<div class="mock-foot">Ada demo mockup · not an official Malaysia Airlines page</div>
<script type="module" src="ada-window.js?v=20261023b"></script>
</body>
</html>
